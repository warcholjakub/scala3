###################################################################################################
###                    THIS IS A WORKFLOW TO PUBLISH THE YUM REPOSITORY                         ###
### HOW TO USE:                                                                                 ###
###   - THE OFFICIAL RELEASE WORKFLOW SHOULD CALL THIS WORKFLOW                                 ###
###   - IT CAN ALSO BE RUN MANUALLY FROM THE ACTIONS TAB, TO REPUBLISH A GIVEN VERSION          ###
###   - IT UPLOADS THE .rpm OF `version` TO THE HOST SERVING repo.scala-lang.org                ###
###                                                                                             ###
### NOTE:                                                                                       ###
###   - THE .rpm IS READ BACK FROM THE GITHUB RELEASE OF `version`, WHICH IS STILL A DRAFT      ###
###   - EVERY PUBLISHED VERSION IS KEPT. THE TARGET ACCOUNT HAS A RESTRICTED SHELL              ###
###     (SFTP/SCP/RSYNC ONLY) SO THE INDEX CANNOT BE REBUILT SERVER-SIDE, AND createrepo_c ONLY ###
###     INDEXES PACKAGES IT CAN SEE ON DISK. INSTEAD THE PUBLISHED INDEX IS FETCHED (METADATA   ###
###     ONLY, NO PACKAGES) AND MERGED WITH THE NEW ONE, SO NO OLDER PACKAGE IS EVER DOWNLOADED. ###
###   - WHERE IT PUBLISHES IS CONFIGURED BY THE PACKAGES_* REPOSITORY VARIABLES, SO A FORK      ###
###     PUBLISHES TO ITS OWN DIRECTORY WITH NO CHANGE TO THIS FILE                              ###
###   - scala3.repo AND KEY.gpg ARE NOT TOUCHED HERE. THEY ARE STATIC AND UPLOADED ONCE BY HAND:###
###     THEY ONLY CHANGE WHEN THE HOSTING URL OR THE SIGNING KEY CHANGES, BOTH OF WHICH ARE     ###
###     DELIBERATE ONE-OFF EVENTS. IF YOU ROTATE THE KEY, RE-UPLOAD KEY.gpg.                    ###
###################################################################################################

name: Publish the YUM repository
run-name: Publish Scala ${{ inputs.version }} to the YUM repository

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The Scala version to publish, i.e. the release tag'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'The Scala version to publish, i.e. the release tag'
        required: true
        type: string

permissions:
  # The release is still a draft when this runs, and drafts are not reachable
  # with read-only access, so the .rpm can only be downloaded with write.
  # Same reason the `provenance` job in ci.yaml asks for it.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION     : ${{ inputs.version }}
      RPM         : scala3-${{ inputs.version }}-x86_64-pc-linux.rpm
      BASE_URL    : ${{ vars.PACKAGES_BASE_URL }}
      FINGERPRINT : ${{ vars.SCALA_PGP_FINGERPRINT }}
      REMOTE      : ${{ vars.PACKAGES_USER }}@${{ vars.PACKAGES_HOST }}
      REMOTE_DIR  : ${{ vars.PACKAGES_PATH }}
      RSH         : ssh -p ${{ vars.PACKAGES_PORT }} -o IdentitiesOnly=yes
    steps:
      - name: Download the .rpm from the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO : ${{ github.repository }}
        run: gh release download "$VERSION" --pattern "$RPM"

      - name: Ensure the repository tooling
        # `rpm` provides rpmsign; `createrepo-c` provides both createrepo_c and mergerepo_c
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm createrepo-c

      - name: Import the signing key
        # Also presets the passphrase in the agent, so rpmsign runs unattended
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.SCALA_PGP_KEY }}
          passphrase     : ${{ secrets.SCALA_PGP_PASSPHRASE }}
          fingerprint    : ${{ env.FINGERPRINT }}

      - name: Set up SSH
        env:
          SSH_KEY    : ${{ secrets.SYNCPKGS_KEY }}
          KNOWN_HOSTS: ${{ vars.PACKAGES_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"     > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Sign the package and build its index
        env:
          # rpmsign warns "Could not set GPG_TTY" when there is no terminal.
          # Setting it to anything skips that probe; signing is unaffected.
          GPG_TTY: /dev/null
        run: |
          mkdir -p new

          # Canonical name inside the repository, read off the package itself
          nvra=$(rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}' "$RPM")
          cp "$RPM" "new/$nvra.rpm"

          # `__gpg` has to be pointed at gpg by hand: rpm defaults to gpg2, which
          # does not exist on Ubuntu, and rpmsign then fails with "Could not exec gpg"
          rpmsign --define "__gpg /usr/bin/gpg" --define "_gpg_name $FINGERPRINT" --addsign "new/$nvra.rpm"

          # Must run after signing: the index records checksums of the signed bytes
          createrepo_c --quiet new

      - name: Merge with the already published index
        # Only repodata/ is fetched, never the packages themselves. mergerepo_c
        # reads the old index as data, so previously published versions stay
        # listed without their .rpm files ever touching this runner.
        run: |
          # Ask over HTTP whether anything is published yet. This distinguishes
          # "first publish" from "the transfer failed" - conflating the two would
          # silently drop every previously published version from the index.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/rpm/repodata/repomd.xml" || echo 000)
          case "$code" in
            200)
              mkdir -p old
              rsync -rt -e "$RSH" "$REMOTE:$REMOTE_DIR/rpm/repodata/" old/repodata/
              mergerepo_c --all --repo=old --repo=new -o merged
              echo "INDEX=merged/repodata" >> "$GITHUB_ENV"
              echo "Merged with the published index"
              ;;
            404)
              echo "INDEX=new/repodata" >> "$GITHUB_ENV"
              echo "Nothing published yet, this is the first publish"
              ;;
            *)
              # Anything else (a proxy error, DNS failure, 000 for no reply) is not
              # evidence that the repository is empty, and carrying on would publish
              # an index listing only this version.
              echo "Cannot tell whether anything is published: HTTP $code" >&2
              exit 1
              ;;
          esac

      - name: Upload
        # Order matters, so the repository is never inconsistent for someone
        # running `dnf install` while we publish:
        #   1. the package, additively - nothing references it yet
        #   2. the index, which now points at a package that is already there
        # --chmod is explicit so a stray umask on the runner cannot produce files
        # the web server is unable to read.
        run: |
          opts="-rt --chmod=D755,F644 --mkpath"

          rsync $opts -e "$RSH" new/*.rpm          "$REMOTE:$REMOTE_DIR/rpm/"
          rsync $opts -e "$RSH" --delete "$INDEX/" "$REMOTE:$REMOTE_DIR/rpm/repodata/"

          echo "Published scala3 $VERSION to $BASE_URL"
