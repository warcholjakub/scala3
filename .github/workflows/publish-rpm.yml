###################################################################################################
###                    THIS IS A WORKFLOW TO PUBLISH THE YUM REPOSITORY                         ###
### HOW TO USE:                                                                                 ###
###   - THE OFFICIAL RELEASE WORKFLOW SHOULD CALL THIS WORKFLOW                                 ###
###   - IT CAN ALSO BE RUN MANUALLY FROM THE ACTIONS TAB, TO REPUBLISH A GIVEN VERSION          ###
###   - IT PUSHES THE .rpm OF `version` INTO THE PACKAGE REPOSITORY SERVED OVER HTTP            ###
###                                                                                             ###
### NOTE:                                                                                       ###
###   - THE .rpm IS READ BACK FROM THE GITHUB RELEASE OF `version`, SO build-rpm.yml MUST HAVE  ###
###     ATTACHED IT THERE                                                                       ###
###   - WHERE IT IS PUBLISHED IS CONFIGURED BY THE PACKAGES_REPO AND PACKAGES_BASE_URL          ###
###     REPOSITORY VARIABLES, SO A FORK PUBLISHES TO ITS OWN SANDBOX WITH NO CHANGE TO THIS FILE##
###################################################################################################

name: Publish the YUM repository
run-name: Publish Scala ${{ inputs.version }} to the YUM repository

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The Scala version to publish, i.e. the release tag'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'The Scala version to publish, i.e. the release tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGES_REPO: ${{ vars.PACKAGES_REPO }}
      BASE_URL     : ${{ vars.PACKAGES_BASE_URL }}
      FINGERPRINT  : ${{ vars.SCALA_PGP_FINGERPRINT }}
      VERSION      : ${{ inputs.version }}
      RPM          : scala3-${{ inputs.version }}-x86_64-pc-linux.rpm
    steps:
      - name: Download the .rpm from the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO : ${{ github.repository }}
        run: gh release download "$VERSION" --pattern "$RPM"

      - name: Check out the package repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PACKAGES_REPO }}
          token     : ${{ secrets.PACKAGES_TOKEN }}
          path      : packages

      - name: Ensure the repository tooling
        # `rpm` provides rpmsign, `createrepo-c` generates the repodata/ index
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm createrepo-c

      - name: Import the signing key
        # Also presets the passphrase in the agent, so rpmsign runs unattended
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.SCALA_PGP_KEY }}
          passphrase     : ${{ secrets.SCALA_PGP_PASSPHRASE }}
          fingerprint    : ${{ env.FINGERPRINT }}

      - name: Update the YUM repository
        run: |
          # Canonical name inside the repository, read off the package itself
          nvra=$(rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}' "$RPM")
          mkdir -p packages/rpm
          cp "$RPM" "packages/rpm/$nvra.rpm"

          # The user-facing repository configuration, regenerated from BASE_URL
          cat > packages/rpm/scala3.repo <<EOF
          [scala3]
          name=Scala 3
          baseurl=$BASE_URL/rpm
          enabled=1
          gpgcheck=1
          gpgkey=$BASE_URL/KEY.gpg
          EOF

          cd packages/rpm
          # `__gpg` has to be pointed at gpg by hand: rpm defaults to gpg2, which
          # does not exist on Ubuntu, and rpmsign then fails with "Could not exec gpg"
          rpmsign --define "__gpg /usr/bin/gpg" --define "_gpg_name $FINGERPRINT" --addsign "$nvra.rpm"
          createrepo_c .

      - name: Publish the public half of the signing key
        run: gpg --armor --export "$FINGERPRINT" > packages/KEY.gpg

      - name: Push
        working-directory: packages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish scala3 $VERSION"
          git push
